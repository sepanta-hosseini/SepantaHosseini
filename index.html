<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Digital 3D business card for a mechanical engineering student exploring AI">
<meta name="theme-color" content="#07050d">
<title>Sepanta Hosseini | Artax Dev</title>
<link rel="icon" href="assets/img/logo-artax.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Vazirmatn:wght@300;500;800&family=Great+Vibes&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="scorp" viewBox="0 0 300 120">
<path pathLength="1" d="M96 60C96 48 126 44 150 50C170 54 182 58 182 62C182 66 170 72 150 74C126 78 96 72 96 60Z"/>
<path pathLength="1" d="M96 60C62 68 26 52 34 28C40 10 68 10 76 28"/>
<path pathLength="1" d="M76 28C82 34 80 44 74 46M74 46l-2 -7"/>
<path pathLength="1" d="M180 56C202 40 222 38 238 46C252 36 264 40 268 50C262 56 250 54 238 46"/>
<path pathLength="1" d="M180 66C202 80 222 82 238 74C252 84 264 80 268 70C262 64 250 66 238 74"/>
<path pathLength="1" d="M112 48l-8 -16M132 46l-4 -18M152 48l4 -18M168 52l10 -14M112 74l-8 16M132 77l-4 18M152 76l4 18M168 70l10 14"/>
<path pathLength="1" d="M120 56h40M120 62h44M122 68h36"/>
</symbol></svg>

<div class="liquid" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
<canvas id="net" aria-hidden="true"></canvas>
<div class="bg" aria-hidden="true"><svg viewBox="0 0 400 400"><circle cx="200" cy="200" r="190" pathLength="100"/><circle cx="200" cy="200" r="150" pathLength="100"/></svg></div>
<div class="lang"><button data-lang="fa">FA</button><button data-lang="en">EN</button></div>

<main class="stage" id="page">
  <div class="scene" id="scene">
   <div class="float"><div class="tilt" id="tilt"><div class="flip" id="flip">

    <!-- FRONT -->
    <section class="face front">
      <div class="glare"></div>
      <svg class="scorp sig" viewBox="0 0 300 120" aria-hidden="true"><use href="#scorp"/></svg>
      <span class="status"><i></i><b data-i="status"></b></span>
      <div class="photo-wrap">
        <div class="ring"></div>
        <img class="photo" id="photo" alt="" src="assets/svg/avatar.svg" onerror="this.onerror=null;this.src='assets/svg/avatar.svg'">
      </div>
      <div class="info">
        <h1><span data-i="name1"></span><span class="n2" data-i="name2"></span></h1>
        <p class="role" data-i="role"></p>
        <p class="spec" data-i="spec"></p>
        <p class="tag"><code>&lt;/&gt;</code><span data-i="tag"></span></p>
        <nav class="icons" id="icons"></nav>
      </div>
      <p class="connect"><span class="wave"><i></i><i></i><i></i><i></i><i></i></span><span data-i="connect"></span></p>
    </section>

    <!-- BACK -->
    <section class="face back">
      <div class="glare"></div>
      <div class="about">
        <p class="term" dir="ltr"><b>$</b> whoami <span>&rarr;</span> <em data-i="role"></em><u></u></p>
        <h2><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-5 5-7 8-7s7 2 8 7"/></svg><span data-i="aboutT"></span></h2>
        <p data-i="about"></p>
        <h2><svg viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></svg><span data-i="stackT"></span></h2>
        <div class="tech" id="tech"></div>
      </div>
      <aside class="side">
        <div class="qr" id="qr"></div>
        <p class="scan" data-i="scan"></p>
        <div id="phoneWrap"></div>
        <p class="sign">Sepanta Hosseini</p>
      </aside>
    </section>

   </div></div></div>
  </div>
  <button class="flipbtn" id="flipBtn"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 15-6.7L21 8M21 3v5h-5M21 12a9 9 0 0 1-15 6.7L3 16M3 21v-5h5"/></svg><span data-i="flip"></span></button>
</main>

<button class="artax" id="artax" aria-haspopup="dialog"><img src="assets/img/logo-artax.png" alt=""><span>Artax Dev</span></button>
<div class="modal" id="modal" aria-hidden="true" role="dialog" aria-modal="true">
  <div class="panel">
    <button class="x" id="mx" aria-label="close">×</button>
    <img src="assets/img/logo-artax.png" alt="Artax Dev">
    <h2 data-i="modalTitle"></h2>
    <div class="names"><span data-i="n1"></span><i></i><span data-i="n2"></span></div>
    <p data-i="tagline"></p>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
<script src="js/bg.js"></script>
<script src="js/lang.js"></script>
<script src="js/contact.js"></script>
<script src="js/card3d.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
